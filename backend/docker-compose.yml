# Deploy on nas: cd ~/dev/spam-filter-for-x/backend && docker compose up -d --build
# Service/container name matches projects/registry.yaml ops.unit (x-account-backend).

services:
  x-account-backend:
    build: .
    container_name: x-account-backend
    restart: unless-stopped
    ports:
      - "3004:3000"
    environment:
      - PORT=3000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    # Network: uses host network or default bridge.
    # Published on nas:3004 (registry port); the container still listens on 3000.
