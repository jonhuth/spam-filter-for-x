# Deploy on nas (first time: cp backend/.env.example backend/.env and set ANTHROPIC_API_KEY):
#   ~/dev/spam-filter-for-x/scripts/deploy-backend.sh
# It builds x-account-backend:<sha> with GIT_SHA baked in, swaps the container, and checks
# /api/health reports that sha. Plain `docker compose up -d --build` still works (sha "unknown").
# Service/container name matches projects/registry.yaml ops.unit (x-account-backend).

services:
  x-account-backend:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    image: x-account-backend:${IMAGE_TAG:-local}
    container_name: x-account-backend
    restart: unless-stopped
    ports:
      - "3004:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=3000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    # Network: uses host network or default bridge.
    # Published on nas:3004 (registry port); the container still listens on 3000.
